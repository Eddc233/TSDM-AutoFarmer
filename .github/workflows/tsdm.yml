
name: TSDM Auto Tasks

on:
  schedule:
    # 每6小时打工
    - cron: '23 */1 * * *'
    # 每天北京时间09:17签到
    - cron: '17 1 * * *'

  workflow_dispatch:

jobs:
  tsdm-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Run Scheduled Task
        env:
          TSDM_COOKIE: ${{ secrets.TSDM_COOKIE }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 1 * * *" ]]; then
              echo "Running daily check-in"
              python tsdm.py checkin
            elif [[ "${{ github.event.schedule }}" == "23 */1 * * *" ]]; then
              echo "Running work check"
              python tsdm.py work
            fi
          else
            echo "Manual trigger - running both tasks"
            python tsdm.py checkin
            python tsdm.py work
          fi
